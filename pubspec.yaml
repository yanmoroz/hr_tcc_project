name: hr_tcc_project
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  dio: ^5.9.0
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_html: ^3.0.0
  flutter_svg: ^2.2.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.2.4
  image_picker: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.2
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.9.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  flutter_gen_runner: ^5.5.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
